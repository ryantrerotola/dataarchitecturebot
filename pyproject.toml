[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snowflake-architect"
version = "0.1.0"
description = "Analyze Snowflake data architecture and lineage, recommend improvements"
requires-python = ">=3.9"
dependencies = [
    "snowflake-connector-python>=3.6.0",
    "click>=8.1.0",
    "networkx>=3.2",
    "pyyaml>=6.0",
    "tabulate>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "ruff>=0.4.0",
]

[project.scripts]
snowflake-architect = "snowflake_architect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
